# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy: connect repo → New Blueprint → use this file
services:
  - type: web
    name: pc-checker-extreme
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn pc_checker_extreme.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pc-checker-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: PCC_API_KEY
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        value: https://pcchecker.gilliomfrontlinedigital.com
      - key: CUSTOM_DOMAINS
        value: pcchecker.gilliomfrontlinedigital.com

databases:
  - name: pc-checker-db
    databaseName: pc_checker
    user: pc_checker
    plan: free
